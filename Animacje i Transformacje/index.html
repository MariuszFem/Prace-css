<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 class="slide-in-text">CSS Animation Showcase</h1>
        <p>Prezentacja przejść, transformacji i animacji klatkowych</p>
    </header>

    <main>
        <section>
            <h2> Transitions</h2>
            <div class="showcase-grid">
                <div class="box trans-color">Hover: Kolor</div>
                <div class="box trans-scale">Hover: Skala</div>
                <div class="box trans-ease">Ease Timing</div>
                <div class="box trans-bezier">Cubic-Bezier</div>
                
                <div class="cascade-container">
                    <div class="cascade-item">Delay 1</div>
                    <div class="cascade-item">Delay 2</div>
                    <div class="cascade-item">Delay 3</div>
                </div>
            </div>
        </section>

        <section>
            <h2> Transforms 2D</h2>
            <div class="showcase-grid">
                <div class="box tf-translate">Translate</div>
                <div class="box tf-rotate">Rotate</div>
                <div class="box tf-scale">Scale</div>
                <div class="box tf-skew">Skew</div>
                <div class="box tf-combo">Kombinacja</div>
            </div>
        </section>

        <section>
            <h2> Keyframe Animations</h2>
            <div class="showcase-grid">
                <div class="animation-unit">
                    <p>Pulsowanie</p>
                    <div class="pulse-element"></div>
                </div>
                
                <div class="animation-unit">
                    <p>Loader / Spinner</p>
                    <div class="spinner"></div>
                </div>

                <div class="animation-unit">
                    <p>Wieloetapowa</p>
                    <div class="multi-stage"></div>
                </div>
            </div>
        </section>
    </main>

    </body>
</html>
